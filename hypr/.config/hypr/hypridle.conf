general {
    # Close the screensaver and wait until it is really gone before locking:
    # hyprlock's background is a screenshot and froze the art into it. See the script.
    lock_cmd = ~/.local/bin/lock-session-cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.local/bin/screens on
    # Hold the suspend until hyprlock really has the session lock. The default
    # released it the moment `loginctl lock-session` ran, racing the suspend.
    inhibit_sleep = 3
}

# Screensaver at 150s, well before the 300s lock. It exits on any key or mouse
# move, so it costs nothing once you touch the machine; the lock then takes
# over at 300s. Nothing is built until this fires -- see screensaver/.
listener {
    timeout = 150
    on-timeout = qs -p ~/.config/quickshell ipc call screensaver start
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screens off at 330s, and back on at the first input. `screens` turns the
# externals off before eDP-1 -- the order that keeps this APU from hard-resetting
# (see the script, and CLAUDE.md "Turning displays off"). Hyprland's own
# key/mouse dpms wake is OFF, so this on-resume is the one wake path; SUPER + O
# reaches it too, via force_idle.
listener {
    timeout = 330
    on-timeout = ~/.local/bin/screens off
    on-resume = ~/.local/bin/screens on
}

listener {
    timeout = 600
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = "0" ] && systemctl suspend
}
