general {
    # Kill the screensaver before locking: it is a fullscreen kitty, and leaving
    # it running under hyprlock wastes a CPU-bound tte loop behind the lock.
    lock_cmd = pkill -f '[v]ivo-screensaver' ; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Screensaver at 150s, well before the 300s lock. It exits on any key, so it
# costs nothing once you touch the machine; the lock then takes over at 300s.
listener {
    timeout = 150
    on-timeout = ~/.local/bin/vivo-screensaver-launch
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = "0" ] && systemctl suspend
}
