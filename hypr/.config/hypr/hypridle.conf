general {
    # Close the screensaver before locking. It renders below the session lock
    # anyway, but leaving it up spends a GPU on a shader nobody can see.
    lock_cmd = qs -p ~/.config/quickshell ipc call screensaver stop ; pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Screensaver at 150s, well before the 300s lock. It exits on any key or mouse
# move, so it costs nothing once you touch the machine; the lock then takes
# over at 300s. Nothing is built until this fires -- see screensaver/.
listener {
    timeout = 150
    on-timeout = qs -p ~/.config/quickshell ipc call screensaver start
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Blank at 330s by killing the BACKLIGHT, not by dpms.
#
# `dpms off` turns every output off at once, and "all displays off" is the one
# state that arms IPS2 on this DCN 3.5 part -- it hard-reset the machine three
# times on 2026-09-23 (memory: amdgpu_dpms_reboot). There is no kernel flag that
# both guards it and keeps deep sleep, so the dpms call is gone instead.
#
# brightnessctl only drives the panel's backlight, so the display engines stay
# up and IPS2 is never reached. Cost: an external monitor keeps its own backlight
# on, showing the black lock screen. Turn it off at its own button if that
# matters.
listener {
    timeout = 330
    on-timeout = brightnessctl --save set 0
    on-resume = brightnessctl --restore
}

listener {
    timeout = 600
    on-timeout = [ "$(cat /sys/class/power_supply/ACAD/online)" = "0" ] && systemctl suspend
}
