# Lock screen. The layout lives here; the look comes from the desktop theme.
#
# The $lock_* variables below are catppuccin-mocha. The `source` line then
# pulls in the active theme's fragment (~/.config/theme/<name>/hyprlock.conf,
# via a symlink theme-switch keeps), which redefines them. The variables must
# be set before the widgets that use them, so the source sits in between. If
# the symlink is missing, hyprlock logs the error, ignores the line and locks
# with these defaults ("Proceeding ignoring faulty entries").
$lock_bg_path           = screenshot
$lock_bg_color          = rgba(17, 17, 17, 1.0)
$lock_bg_blur_passes    = 3
$lock_bg_blur_size      = 8
$lock_bg_noise          = 0.02
$lock_bg_contrast       = 0.9
$lock_bg_brightness     = 0.7
$lock_bg_vibrancy       = 0.2
$lock_input_inner       = rgba(30, 30, 46, 0.6)
$lock_input_outer       = rgba(203, 166, 247, 0.7)
$lock_input_text        = rgba(205, 214, 244, 1.0)
$lock_input_font        = Sans
$lock_input_outline     = 3
$lock_input_rounding    = 15
$lock_input_check       = rgba(137, 180, 250, 0.7)
$lock_input_fail        = rgba(243, 139, 168, 0.8)
$lock_time_font         = JetBrainsMono Nerd Font Bold
$lock_time_color        = rgba(205, 214, 244, 0.9)
$lock_time_shadow_passes = 2
$lock_time_shadow_size  = 3
$lock_time_shadow_color = rgba(0, 0, 0, 0.5)
$lock_font              = JetBrainsMono Nerd Font
$lock_date_color        = rgba(186, 194, 222, 0.8)
$lock_greet_color       = rgba(203, 166, 247, 0.9)
$lock_sleep_color       = rgba(166, 227, 161, 0.8)

source = ~/.local/state/theme/hyprlock.conf

background {
    monitor =
    path = $lock_bg_path
    color = $lock_bg_color
    blur_passes = $lock_bg_blur_passes
    blur_size = $lock_bg_blur_size
    noise = $lock_bg_noise
    contrast = $lock_bg_contrast
    brightness = $lock_bg_brightness
    vibrancy = $lock_bg_vibrancy
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center

    inner_color = $lock_input_inner
    outer_color = $lock_input_outer
    font_color = $lock_input_text
    font_family = $lock_input_font
    outline_thickness = $lock_input_outline

    check_color = $lock_input_check
    fail_color = $lock_input_fail

    placeholder_text = <i>Password...</i>
    # $FAIL is PAM's own message — it carries "(N minutes left to unlock)" when
    # pam_faillock has temporarily locked the account after 3 bad tries. Without
    # it you just see "Wrong!" and keep typing a correct password into a lockout.
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    rounding = $lock_input_rounding
    fade_on_empty = false
    dots_center = true
    dots_spacing = 0.3
    dots_size = 0.3
}

# Time
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $lock_time_font
    color = $lock_time_color
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = $lock_time_shadow_passes
    shadow_size = $lock_time_shadow_size
    shadow_color = $lock_time_shadow_color
}

# Date
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    font_size = 24
    font_family = $lock_font
    color = $lock_date_color
    position = 0, 110
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    font_size = 20
    font_family = $lock_font
    color = $lock_greet_color
    position = 0, -160
    halign = center
    valign = center
}

# Sleep button (clickable). The glyph is a Nerd Font icon, so its font is fixed.
label {
    monitor =
    text = 󰒲
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    color = $lock_sleep_color
    position = 40, 40
    halign = left
    valign = bottom
    onclick = systemctl suspend
}
