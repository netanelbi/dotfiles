screencopy {
    allow_token_by_default = true

    # The Quickshell picker (quickshell/.config/quickshell/sharepicker/), which
    # shows a LIVE thumbnail of every screen and window instead of the stock
    # picker's list of strings. The wrapper falls back to
    # /usr/bin/hyprland-share-picker if Quickshell cannot answer, so screen
    # sharing keeps working even when the shell does not.
    #
    # Roll back to the stock picker by commenting this one line out and
    # restarting xdph:
    #     systemctl --user restart xdg-desktop-portal-hyprland
    custom_picker_binary = /home/netanel/.local/bin/hypr-share-picker
}
