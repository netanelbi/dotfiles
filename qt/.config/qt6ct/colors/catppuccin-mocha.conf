# Catppuccin Mocha palette for qt6ct (Fusion style).
#
# This is what themes the system-tray context menus the Quickshell bar opens.
# Those menus are QtWidgets platform menus, NOT QML, so Theme.qml does not
# reach them -- without this they render in qt6ct's generic grey "darker".
#
# 21 entries, in QPalette role order:
#  WindowText Button Light Midlight Dark Mid Text BrightText ButtonText Base
#  Window Shadow Highlight HighlightedText Link LinkVisited AlternateBase
#  NoRole ToolTipBase ToolTipText PlaceholderText
#
# Hexes match waybar/style.css @define-color, so bar and menu agree.
[ColorScheme]
active_colors=#ffcdd6f4, #ff313244, #ff585b70, #ff45475a, #ff11111b, #ff181825, #ffcdd6f4, #fff5e0dc, #ffcdd6f4, #ff1e1e2e, #ff1e1e2e, #ff11111b, #ffcba6f7, #ff1e1e2e, #ff89b4fa, #ffcba6f7, #ff181825, #ff1e1e2e, #ff313244, #ffcdd6f4, #806c7086
disabled_colors=#ff6c7086, #ff313244, #ff585b70, #ff45475a, #ff11111b, #ff181825, #ff6c7086, #fff5e0dc, #ff6c7086, #ff1e1e2e, #ff1e1e2e, #ff11111b, #ff45475a, #ff6c7086, #ff89b4fa, #ffcba6f7, #ff181825, #ff1e1e2e, #ff313244, #ff6c7086, #806c7086
inactive_colors=#ffcdd6f4, #ff313244, #ff585b70, #ff45475a, #ff11111b, #ff181825, #ffcdd6f4, #fff5e0dc, #ffcdd6f4, #ff1e1e2e, #ff1e1e2e, #ff11111b, #ff585b70, #ffcdd6f4, #ff89b4fa, #ffcba6f7, #ff181825, #ff1e1e2e, #ff313244, #ffcdd6f4, #806c7086
