[Login]
# On battery, closing the lid suspends. On AC it does NOT — the machine keeps
# running with the lid shut, on purpose, so overnight agent sessions survive.
#
# This is set explicitly instead of leaning on HandleLidSwitchDocked=ignore,
# because "docked" is not the property it sounds like: logind only counts a
# display when its DRM connector is both `connected` AND `enabled`, and turning
# the screens off flips `enabled` to disabled. On 2026-08-21 SUPER+O blanked the
# outputs 1.9s before a lid close, the external-display count fell to zero, the
# docked branch was skipped, and the box suspended for 9.6h in the middle of two
# working sessions. Keying off AC power sidesteps that detection entirely.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
