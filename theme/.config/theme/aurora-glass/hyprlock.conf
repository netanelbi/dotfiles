# Aurora Glass -- lock screen (sourced by hyprlock.conf; see theme-switch).
# The colour-field wallpaper, frosted; a translucent white glass field.
$lock_bg_path           = ~/.config/theme/aurora-glass/wallpaper.png
$lock_bg_color          = rgb(1b1530)
$lock_bg_blur_passes    = 3
$lock_bg_blur_size      = 10
$lock_bg_noise          = 0.02
$lock_bg_contrast       = 0.9
$lock_bg_brightness     = 0.8
$lock_bg_vibrancy       = 0.3
$lock_input_inner       = rgba(ffffff24)
$lock_input_outer       = rgba(ffffff8c)
$lock_input_text        = rgb(ffffff)
$lock_input_font        = Outfit
$lock_input_outline     = 1
$lock_input_rounding    = 18
$lock_input_check       = rgba(9ff0ffcc)
$lock_input_fail        = rgba(ff9eb5ee)
$lock_time_font         = Outfit Light
$lock_time_color        = rgba(ffffffee)
$lock_time_shadow_passes = 2
$lock_time_shadow_size  = 6
$lock_time_shadow_color = rgba(0a002866)
$lock_font              = Outfit
$lock_date_color        = rgba(f6f4ffcc)
$lock_greet_color       = rgba(ffd0ecee)
$lock_sleep_color       = rgba(9ff5ddcc)
