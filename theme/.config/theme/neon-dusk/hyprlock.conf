# Neon Dusk -- lock screen (sourced by hyprlock.conf; see theme-switch).
# The synthwave sunset, lightly blurred; pink->cyan ring, glowing cyan clock
# (the time label's shadow is the glow).
$lock_bg_path           = ~/.config/theme/neon-dusk/wallpaper.png
$lock_bg_color          = rgb(0d0221)
$lock_bg_blur_passes    = 1
$lock_bg_blur_size      = 4
$lock_bg_noise          = 0.02
$lock_bg_contrast       = 0.9
$lock_bg_brightness     = 0.8
$lock_bg_vibrancy       = 0.2
$lock_input_inner       = rgba(0d0221cc)
$lock_input_outer       = rgb(ff38ac) rgb(2de2e6) 45deg
$lock_input_text        = rgb(f3e9ff)
$lock_input_font        = Chakra Petch Medium
$lock_input_outline     = 2
$lock_input_rounding    = 6
$lock_input_check       = rgb(2de2e6)
$lock_input_fail        = rgb(ff4f6d)
$lock_time_font         = Chakra Petch Bold
$lock_time_color        = rgb(2de2e6)
$lock_time_shadow_passes = 3
$lock_time_shadow_size  = 8
$lock_time_shadow_color = rgba(2de2e6aa)
$lock_font              = Chakra Petch Medium
$lock_date_color        = rgb(c9b6ea)
$lock_greet_color       = rgb(ff38ac)
$lock_sleep_color       = rgb(f6c945)
