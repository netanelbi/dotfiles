# Paper -- lock screen (sourced by hyprlock.conf; see theme-switch).
# The ruled page, unblurred; ink hairline field, italic serif clock, one red.
$lock_bg_path           = ~/.config/theme/paper/wallpaper.png
$lock_bg_color          = rgb(f2efe8)
$lock_bg_blur_passes    = 0
$lock_bg_blur_size      = 8
$lock_bg_noise          = 0
$lock_bg_contrast       = 1
$lock_bg_brightness     = 1
$lock_bg_vibrancy       = 0
$lock_input_inner       = rgb(fbfaf6)
$lock_input_outer       = rgb(1d1b18)
$lock_input_text        = rgb(1d1b18)
$lock_input_font        = IBM Plex Mono
$lock_input_outline     = 1
$lock_input_rounding    = 0
$lock_input_check       = rgb(45413a)
$lock_input_fail        = rgb(b3261e)
$lock_time_font         = Newsreader Italic
$lock_time_color        = rgb(1d1b18)
$lock_time_shadow_passes = 0
$lock_time_shadow_size  = 3
$lock_time_shadow_color = rgba(00000000)
$lock_font              = IBM Plex Mono
$lock_date_color        = rgb(45413a)
$lock_greet_color       = rgb(b3261e)
$lock_sleep_color       = rgb(1d1b18)
