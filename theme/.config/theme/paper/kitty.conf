# Paper -- kitty colours (included by kitty.conf; see theme-switch).
# Light page, ink colours. Every ANSI colour is an ink, so 7 and 15 ("white")
# are greys dark enough to read on the page, not near-white.
background_opacity      1.0
foreground              #1d1b18
background              #fbfaf6
selection_foreground    #fbfaf6
selection_background    #1d1b18
url_color               #b3261e

# Cursor
cursor                  #1d1b18
cursor_text_color       #fbfaf6

# Borders between splits, tab bar
active_border_color     #1d1b18
inactive_border_color   #d9d4c8
bell_border_color       #b3261e
tab_bar_background      #f2efe8
active_tab_foreground   #fbfaf6
active_tab_background   #1d1b18
inactive_tab_foreground #45413a
inactive_tab_background #ece8dd

# Normal colors
color0  #1d1b18
color1  #b3261e
color2  #2f5d3a
color3  #7a5a00
color4  #1f4e8c
color5  #6b3f8c
color6  #1f5f5a
color7  #5e594f

# Bright colors
color8  #8a857b
color9  #8c2a2a
color10 #3a6b45
color11 #9a4a12
color12 #1f5f80
color13 #9a2f66
color14 #1d6a7a
color15 #45413a

# Marks
mark1_foreground #1d1b18
mark1_background #d9d4c8
mark2_foreground #fbfaf6
mark2_background #b3261e
mark3_foreground #fbfaf6
mark3_background #1f4e8c
