# Tonal -- lock screen (sourced by hyprlock.conf; see theme-switch).
# The green wallpaper, unblurred; a pill field on the tonal container.
$lock_bg_path           = ~/.config/theme/tonal/wallpaper.png
$lock_bg_color          = rgb(dfe7da)
$lock_bg_blur_passes    = 0
$lock_bg_blur_size      = 8
$lock_bg_noise          = 0
$lock_bg_contrast       = 1
$lock_bg_brightness     = 1
$lock_bg_vibrancy       = 0
$lock_input_inner       = rgb(f6faf1)
$lock_input_outer       = rgb(bfe0b4)
$lock_input_text        = rgb(1a1d18)
$lock_input_font        = Figtree
$lock_input_outline     = 3
$lock_input_rounding    = -1
$lock_input_check       = rgb(3e6a37)
$lock_input_fail        = rgb(ba1a1a)
$lock_time_font         = Figtree Medium
$lock_time_color        = rgb(1a1d18)
$lock_time_shadow_passes = 0
$lock_time_shadow_size  = 3
$lock_time_shadow_color = rgba(00000000)
$lock_font              = Figtree
$lock_date_color        = rgb(3c4538)
$lock_greet_color       = rgb(3e6a37)
$lock_sleep_color       = rgb(3e6a37)
