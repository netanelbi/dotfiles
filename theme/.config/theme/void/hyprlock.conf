# Void -- lock screen (sourced by hyprlock.conf; see theme-switch).
# No wallpaper: an empty path draws the flat colour. Grey type, coral accent.
$lock_bg_path           =
$lock_bg_color          = rgb(0e0e10)
$lock_bg_blur_passes    = 0
$lock_bg_blur_size      = 8
$lock_bg_noise          = 0
$lock_bg_contrast       = 1
$lock_bg_brightness     = 1
$lock_bg_vibrancy       = 0
$lock_input_inner       = rgb(141417)
$lock_input_outer       = rgb(222227)
$lock_input_text        = rgb(e6e6e6)
$lock_input_font        = Inter
$lock_input_outline     = 1
$lock_input_rounding    = 10
$lock_input_check       = rgb(b4b4bc)
$lock_input_fail        = rgb(ff7a59)
$lock_time_font         = Inter Light
$lock_time_color        = rgb(e6e6e6)
$lock_time_shadow_passes = 0
$lock_time_shadow_size  = 3
$lock_time_shadow_color = rgba(00000000)
$lock_font              = Inter
$lock_date_color        = rgb(8e8e97)
$lock_greet_color       = rgb(ff7a59)
$lock_sleep_color       = rgb(6b6b73)
