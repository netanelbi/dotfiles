# vivo (AMD/1200p Vivobook) machine-specific Hyprland settings — sourced by hyprland.conf
# Cursor + environment
env = XCURSOR_SIZE,32
env = XCURSOR_THEME,Catppuccin-Mocha-Mauve-Cursors
cursor {
    # Software cursor so the pointer is composited into the framebuffer and
    # thus captured by screen sharing (hardware cursor lives on a separate
    # overlay plane that screencasts miss). See `laser-pointer` script.
    no_hardware_cursors = true
}
# Gaps
general {
    gaps_out = 6
}

# Sunshine streaming (vivo-only): stream workspace + headless output autostart
workspace = name:stream, monitor:HEADLESS-1
exec-once = hyprctl output create headless
exec-once = systemctl --user start sunshine
bind = $mainMod, M, workspace, name:stream

# Desk off ("server mode"): lock + darken, wake on any real input. Replaces
# hypr-display-toggle, whose `dpms off` armed IPS2 and hard-reset the box —
# desk-blank always leaves one real output enabled (see machine.lua).
bindl = $mainMod, O, exec, ~/.local/bin/desk-blank toggle
